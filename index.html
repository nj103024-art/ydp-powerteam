<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="특허·유통·홈페이지·영상·광고·코칭. BNI YDP 프로페셔널 챕터 마케팅 파워팀 6인. 필요한 전문가만 골라 연결합니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="YDP 마케팅 파워팀">
<meta property="og:description" content="특허·유통·홈페이지·영상·광고·코칭. 필요한 전문가만 골라 연결합니다.">
<meta property="og:image" content="https://nj103024-art.github.io/ydp-powerteam/og.jpg">
<meta property="og:url" content="https://nj103024-art.github.io/ydp-powerteam/">
<meta name="twitter:card" content="summary_large_image">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>YDP 마케팅 파워팀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@200;300;500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 흰 스튜디오 지면 위에 사람(사진)과 숫자만 크게. 도식은 가는 선 하나로 연결. */
:root{
  --paper:#FBFBF9; --panel:#F2F1ED; --studio:#EEECE7;
  --ink:#17191C; --ink-2:#4A4D52; --mute:#7C7F84; --line:#E1DFD9;
  --accent:#7A5C34; --accent-soft:#EFE7DA;
  --f-display:"Hahmlet","Noto Serif KR",Georgia,serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --wrap:1120px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#131416; --panel:#1B1D20; --studio:#E9E7E2;
  --ink:#EDEBE6; --ink-2:#B9B7B1; --mute:#8D8C88; --line:#2C2E32;
  --accent:#C9A56E; --accent-soft:#2A241B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131416; --panel:#1B1D20; --studio:#E9E7E2;
  --ink:#EDEBE6; --ink-2:#B9B7B1; --mute:#8D8C88; --line:#2C2E32;
  --accent:#C9A56E; --accent-soft:#2A241B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
h1,h2,h3{font-family:var(--f-display);font-weight:500;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.num{font-family:var(--f-display);font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;height:56px}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--mute);margin-left:8px;letter-spacing:.08em}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{font-size:13px;text-decoration:none;color:var(--ink-2);padding:6px 10px;border-radius:999px;white-space:nowrap}
.nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.nav a:focus-visible,.btn:focus-visible,.pcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

section{padding-block:clamp(56px,8vw,96px)}
section + section{border-top:1px solid var(--line)}
.sec-head{display:grid;gap:12px;margin-bottom:40px;max-width:720px}
.sec-head h2{font-size:clamp(26px,3.4vw,38px)}
.sec-head p{color:var(--ink-2)}

/* HOME hero */
.hero{padding-block:clamp(40px,6vw,72px) 0}
.hero h1{font-size:clamp(34px,6vw,72px);font-weight:300;line-height:1.15}
.hero h1 b{font-weight:700}
.hero .lead{margin-top:20px;max-width:560px;color:var(--ink-2);font-size:17px}
.roster{margin-top:40px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.roster a{text-decoration:none;display:grid;gap:2px;min-width:0}
.roster .ph{aspect-ratio:4/5;background:var(--studio);border-radius:3px;overflow:hidden;margin-bottom:10px}
.roster .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.roster a:hover img{transform:scale(1.03)}
.roster b{font-family:var(--f-display);font-weight:500;font-size:18px}
.roster span{font-size:12px;color:var(--mute);line-height:1.4}
.roster a:hover b{color:var(--accent)}

/* flow diagram */
.flow{display:grid;grid-template-columns:repeat(6,1fr);position:relative}
.flow::before{content:"";position:absolute;left:8%;right:8%;top:38px;height:1px;background:var(--ink)}
.step{position:relative;display:grid;justify-items:center;text-align:center;gap:10px;padding-inline:6px;text-decoration:none}
.step .dot{width:76px;height:76px;border-radius:50%;background:var(--studio);overflow:hidden;border:1px solid var(--ink);position:relative;z-index:1}
.step .dot img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;transform:scale(1.35);transform-origin:50% 20%}
.step .verb{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--accent)}
.step h3{font-size:18px}
.step p{font-size:13px;color:var(--ink-2);line-height:1.5}
.step:hover h3{color:var(--accent)}

/* partner cards */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.pcard{background:var(--paper);padding:28px 24px;display:grid;gap:14px;text-decoration:none;align-content:start;min-width:0}
.pcard:hover{background:var(--panel)}
.pcard .who{display:flex;align-items:center;gap:12px}
.pcard .who img{width:48px;height:48px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:var(--studio)}
.pcard .who b{font-family:var(--f-display);font-weight:500;font-size:19px;display:block}
.pcard .who span{font-size:12px;color:var(--mute)}
.pcard .fit{font-size:15px;color:var(--ink);line-height:1.6}
.pcard .fit::before{content:"이런 분의 파트너";display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--mute);margin-bottom:4px}
.pcard .big{display:flex;align-items:baseline;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.pcard .big .num{font-size:40px}
.pcard .big small{font-size:13px;color:var(--ink-2)}
.pcard .more{font-size:13px;color:var(--accent)}

/* packages */
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pack{border:1px solid var(--line);padding:28px 24px;display:grid;gap:18px;align-content:start;min-width:0}
.pack .when{font-family:var(--f-mono);font-size:12px;color:var(--mute);letter-spacing:.06em}
.pack h3{font-size:22px}
.pack ol{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:s}
.pack li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line);font-size:14px}
.pack li img{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:var(--studio)}
.pack li b{font-weight:600}
.pack li span{color:var(--ink-2)}

/* process */
.proc{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--ink)}
.proc div{padding:20px 20px 0 0;display:grid;gap:6px}
.proc .k{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.proc h3{font-size:19px}
.proc p{font-size:14px;color:var(--ink-2)}

/* proof */
.proof{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;background:var(--panel);padding:clamp(24px,4vw,48px)}
.proof .pair{display:flex;gap:0;align-items:end;justify-content:center;background:var(--studio);border-radius:4px;padding-top:20px;overflow:hidden;min-height:260px}
.proof .pair img{height:260px;width:auto;object-fit:contain;object-position:bottom}
.proof h3{font-size:24px;margin-bottom:12px}
.proof p{color:var(--ink-2)}

.cta{display:grid;gap:18px;justify-items:start}
.cta h2{font-size:clamp(28px,4vw,44px);font-weight:300}
.cta h2 b{font-weight:700}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);border:0;padding:12px 18px;font:500 14px var(--f-body);border-radius:999px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}

/* MEMBER PAGE */
.m-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(24px,5vw,64px);align-items:end;padding-block:clamp(32px,5vw,56px) 0}
.m-hero .txt{display:grid;gap:18px;padding-bottom:clamp(24px,4vw,48px)}
.m-hero .role{font-size:14px;color:var(--ink-2)}
.m-hero h1{font-size:clamp(44px,7vw,84px);font-weight:700;line-height:1}
.m-hero .co{font-family:var(--f-display);font-size:clamp(18px,2vw,22px);font-weight:300}
.m-hero blockquote{margin:0;font-family:var(--f-display);font-size:clamp(22px,2.8vw,32px);font-weight:300;line-height:1.35;border-left:2px solid var(--accent);padding-left:18px}
.m-hero .photo{background:var(--studio);border-radius:4px 4px 0 0;height:clamp(360px,48vw,560px);display:flex;justify-content:center;align-items:flex-end;overflow:hidden}
.m-hero .photo img{height:108%;width:auto;max-width:none;object-fit:contain;object-position:top;align-self:flex-start;margin-top:6%}

.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.stat{padding:28px 20px 28px 0;display:grid;gap:10px;align-content:start;min-width:0}
.stat + .stat{padding-left:20px;border-left:1px solid var(--line)}
.stat .num{font-size:clamp(40px,5.2vw,64px)}
.stat .num sup{font-size:.42em;font-weight:300;vertical-align:.9em;margin-left:2px}
.stat .num sub{font-size:.34em;font-weight:300;vertical-align:baseline;margin-left:4px;letter-spacing:0}
.stat p{font-size:14px;color:var(--ink-2);line-height:1.5}
.note{font-size:12px;color:var(--mute);margin-top:14px;line-height:1.6}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(24px,4vw,56px)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:baseline}
.list li b{font-weight:600}
.list li span{color:var(--mute);font-size:13px;font-family:var(--f-mono);white-space:nowrap}
.list li p{grid-column:1/-1;color:var(--ink-2);font-size:14px;margin-top:-6px}
.h3{font-size:20px;margin-bottom:16px}

.awards{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.award{background:var(--paper);padding:24px 20px;display:grid;gap:8px;align-content:start}
.award .where{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--accent)}
.award b{font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.35}
.award span{font-size:13px;color:var(--ink-2)}

.vids{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.vid{text-decoration:none;display:grid;gap:10px;min-width:0}
.vid .th{aspect-ratio:16/9;overflow:hidden;background:var(--panel);border-radius:2px;position:relative}
.vid .th img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.vid .th::after{content:"▶";position:absolute;right:10px;bottom:8px;font-size:11px;color:#fff;background:rgba(0,0,0,.55);padding:3px 7px;border-radius:2px}
.vid:hover img{transform:scale(1.04)}
.vid b{font-size:14px;font-weight:500;line-height:1.45}
.vid span{font-size:12px;color:var(--mute)}

.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.feat{background:var(--paper);padding:24px 22px;display:grid;gap:8px;align-content:start}
.feat .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--accent)}
.feat b{font-family:var(--f-display);font-weight:500;font-size:20px;line-height:1.35}
.feat p{font-size:14px;color:var(--ink-2)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--ink-2);padding:8px 14px;border-radius:999px;font:500 13px var(--f-body);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs button:focus-visible,.need:focus-visible,.combo:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.picker{display:grid;gap:20px}
.needs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.need{text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:16px 18px;font:500 15px var(--f-body);cursor:pointer;display:grid;gap:4px;border-radius:3px}
.need span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--mute)}
.need[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.need[aria-pressed="true"] span{color:var(--accent-soft)}
.combos{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.combos span{margin-right:4px}
.combo{border:1px dashed var(--ink-2);background:transparent;color:var(--ink);padding:6px 12px;border-radius:999px;font:500 13px var(--f-body);cursor:pointer}
.picked{border-top:1px solid var(--ink);padding-top:18px}
.picked .cnt{font-size:14px;color:var(--ink-2);margin-bottom:14px}
.picked .cnt b{color:var(--accent);font-size:18px}
.pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pk a{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;text-decoration:none;background:var(--panel);padding:14px}
.pk img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:var(--studio)}
.pk b{font-family:var(--f-display);font-weight:500;font-size:18px;display:block}
.pk span{font-size:12px;color:var(--mute);display:block}
.pk small{font-size:13px;color:var(--ink-2)}
.net{width:100%;max-width:360px;height:auto;justify-self:center}
.net line{stroke:var(--ink-2);stroke-width:.8;opacity:.45}
.net .ring{fill:var(--studio);stroke:var(--ink);stroke-width:1}
.lead-map{margin-top:32px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.node{border:1px solid var(--line);padding:12px 18px;font-weight:600;font-size:15px;display:grid;gap:2px;border-radius:3px}
.node small{font-weight:400;font-size:12px;color:var(--mute)}
.node.main{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.node.main small{color:var(--accent-soft)}
.arr{color:var(--mute);font-size:18px}
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.case{border:1px solid var(--line);padding:28px 24px;display:grid;gap:16px;align-content:start;min-width:0}
.case .when{font-family:var(--f-mono);font-size:12px;color:var(--mute)}
.case h3{font-size:21px;line-height:1.4}
.case p{font-size:14px;color:var(--ink-2)}
.roas{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:16px 0;border-block:1px solid var(--line)}
.roas span{display:block;font-size:12px;color:var(--mute);margin-bottom:6px}
.roas .num{font-size:44px}
.roas .acc{color:var(--accent)}
.roas i{font-style:normal;color:var(--mute);font-size:22px;padding-bottom:8px}
.roas em{font-style:normal;font-family:var(--f-mono);font-size:13px;background:var(--accent-soft);color:var(--accent);padding:4px 8px;margin-bottom:10px}
.ba{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.ba li{display:grid;grid-template-columns:64px 1fr;gap:10px;color:var(--ink-2)}
.ba li span{font-family:var(--f-mono);font-size:12px;color:var(--mute)}
.ba li+li span{color:var(--accent)}
.case blockquote{margin:0;font-family:var(--f-display);font-weight:300;font-size:16px;line-height:1.55;background:var(--panel);padding:16px 18px}
.case cite{display:block;font-style:normal;font-family:var(--f-body);font-size:12px;color:var(--mute);margin-top:8px}
.rec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(24px,4vw,56px)}
.rec .when{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--accent);margin-bottom:10px}
.big-n{font-family:var(--f-display)!important;font-weight:200;font-size:30px!important;color:var(--ink)!important;letter-spacing:-.02em}
.clients{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.clients span{background:var(--paper);padding:18px 12px;text-align:center;font-weight:600;font-size:14px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px;color:var(--ink-2)}

.steps{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:0;border-top:1px solid var(--ink)}
.steps div{padding:18px 18px 0 0;display:grid;gap:6px;align-content:start}
.steps .k{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.steps b{font-family:var(--f-display);font-weight:500;font-size:18px}
.steps p{font-size:14px;color:var(--ink-2)}

.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.contact div{background:var(--paper);padding:20px;display:grid;gap:6px;min-width:0}
.contact label{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--mute)}
.contact .val{font-size:16px;font-weight:500;overflow-wrap:anywhere;user-select:all}
.contact button{justify-self:start;background:none;border:0;padding:0;font:500 12px var(--f-body);color:var(--accent);cursor:pointer}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}

.pairs{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.pairs a{display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:center;border:1px solid var(--line);padding:16px;text-decoration:none}
.pairs a:hover{background:var(--panel)}
.pairs img{width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:var(--studio)}
.pairs b{font-family:var(--f-display);font-weight:500;font-size:18px;display:block}
.pairs span{font-size:14px;color:var(--ink-2)}

footer{border-top:1px solid var(--line);padding-block:28px 40px;color:var(--mute);font-size:12px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

@media (max-width:900px){
  .pgrid,.packs,.needs{grid-template-columns:1fr 1fr}
  .cases{grid-template-columns:1fr}
  .clients{grid-template-columns:repeat(3,minmax(0,1fr))}
  .awards,.vids,.feats{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(3){padding-left:0;border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .proof{grid-template-columns:1fr}
}
@media (max-width:720px){

      <li><b>종합가구 · 매출</b><span>1.2억 → 3억</span></li>
      <li><b>판촉물 · 매출</b><span>5억 → 8억 (+60%)</span></li></ul></div>
  </div>
  <div class="wrap"><p class="note">위 수치는 광고 총괄·관리 과정에서 함께 경험한 개별 사례입니다. 매출은 광고뿐 아니라 상품·가격·영업·시장 환경 등 다양한 요인의 영향을 받으며, 동일한 결과를 보장하지 않습니다.</p></div></section>
  <section><div class="wrap">
    <div class="sec-head"><p class="eyebrow">Curriculum</p><h2>대표님 수준에 맞춰 시작합니다</h2></div>
    <div class="steps" style="--n:3">
      <div><span class="k">LEVEL 01</span><b>광고가 처음이라면</b><p>광고가 필요한지, 무엇부터 할지, 예산은 얼마로 잡을지</p></div>
      <div><span class="k">LEVEL 02</span><b>이미 하고 있다면</b><p>보고서를 함께 읽고, 잘되고 있는지와 무엇을 바꿀지 판단 기준을 만듭니다</p></div>
      <div><span class="k">LEVEL 03</span><b>더 잘하고 싶다면</b><p>광고비 증액, 대행사 판단, 전환율과 고객 여정까지</p></div>
    </div>
  </div></section>`;
  if(k==="kang") return `
  <section><div class="wrap">
    <div class="sec-head"><p class="eyebrow">Track record</p><h2>경험과 역사는 오늘도 쌓여갑니다</h2></div>
    <div class="rec">
      <div class="rec-g"><p class="when">특허 · 상표 · 디자인</p>
        <ul class="list"><li><b>출원</b><span class="big-n">30,000+</span></li><li><b>심판 · 소송</b><span class="big-n">3,000+</span></li><li><b>합의 · 조정 등</b><span class="big-n">500+</span></li></ul></div>
      <div class="rec-g"><p class="when">저작권 · 부정경쟁</p>
        <ul class="list"><li><b>심판 · 소송</b><span class="big-n">100+</span></li><li><b>합의 · 조정 등</b><span class="big-n">500+</span></li></ul></div>
    </div>
  </div></section>
  <section><div class="wrap">
    <div class="sec-head"><p class="eyebrow">Since 1975</p><h2>1975년 창업 이래, 3대에 걸쳐 50년</h2></div>
    <div class="steps" style="--n:4">
      <div><span class="k">1975</span><b>강동수 변리사 창립</b><p>특허청 항고심판소장 역임</p></div>
      <div><span class="k">1982</span><b>강일우 대표변리사</b><p>강&강국제특허법률사무소 대표</p></div>
      <div><span class="k">1993</span><b>지유 PATENT HOUSE</b><p>논현동 사옥 준공</p></div>
      <div><span class="k">2020</span><b>강인혁 변호사·변리사</b><p>KAIST 지식재산대학원 석사</p></div>
    </div>
  </div></section>
  <section><div class="wrap two">
    <div><h3 class="h3">방송 출연</h3><ul class="list">
      <li><b>KBS 성공예감</b><span>2023 · 2024</span></li>
      <li><b>SBS 궁금한 이야기 Y</b><span>2024 · 2025</span></li>
      <li><b>SBS 모닝와이드</b><span>2024</span></li>
      <li><b>KTV ‘잘사는 법(法)’ 생방송 단독</b><span>2025</span></li>
      <li><b>서울신문 지식채널 「시냅스」</b><span>2025</span></li>
      <li><b>유튜브 강인혁변호사의 PTCD</b><span>구독자 2.09만</span></li></ul></div>
    <div><h3 class="h3">강연 · 강의</h3><ul class="list">
      <li><b>경북대 「랜선 지식재산토크쇼」</b><span>2024</span></li>
      <li><b>한국교육학술정보원 저작권 전문가 양성 연수</b><span>2025</span></li>
      <li><b>명지대학교 교육학습센터</b><span>2025</span></li>
      <li><b>시청자미디어재단</b><span>2025</span></li>
      <li><b>서울연극센터(서울문화재단)</b><span>2025</span></li>
      <li><b>인천테크노파크 지식재산권과 브랜드 관리</b><span>2026</span></li></ul></div>
  </div></section>`;
  return "";
}

function member(k){
  const m=M[k];
  return `
  <div class="wrap m-hero">
    <div class="txt">
      <p class="eyebrow">${m.verb} · ${esc(m.short)}</p>
      <div><h1>${m.name}</h1><p class="co" style="margin-top:10px">${esc(m.co)}</p><p class="role">${esc(m.role)}</p></div>
      <blockquote>${esc(m.quote)}</blockquote>
    </div>
    <div class="photo"><img src="${m.img}" alt="${m.name} 대표"></div>
  </div>
  <div class="wrap"><div class="stats">${m.stats.map(([n,u,t])=>`<div class="stat"><span class="num">${n}${u?`<sub>${u}</sub>`:""}</span><p>${esc(t)}</p></div>`).join("")}</div></div>

  <section><div class="wrap two">
    <div><p class="eyebrow" style="margin-bottom:10px">Partner for</p><h2 style="font-size:clamp(24px,3vw,32px);font-weight:300;line-height:1.4">${esc(m.fit)}</h2></div>
    <div><h3 class="h3">할 수 있는 일</h3><ul class="list">${m.services.map(([a,b])=>`<li><b>${esc(a)}</b><p>${esc(b)}</p></li>`).join("")}</ul></div>
  </div></section>
  ${extra(m.extra)}
  <section><div class="wrap">
    <div class="sec-head"><p class="eyebrow">Better together</p><h2>${m.name} 대표와 함께하면 좋은 파트너</h2></div>
    <div class="pairs">${m.pairs.map(([p,why])=>`<a href="#${p}">${face(p)}<div><b>${M[p].name} <small style="font-family:var(--f-body);font-size:13px;color:var(--mute);font-weight:400">${esc(M[p].short)}</small></b><span>${esc(why)}</span></div></a>`).join("")}</div>
  </div></section>

  <section><div class="wrap">
    <div class="sec-head"><p class="eyebrow">Contact</p><h2>연락처</h2></div>
    <div class="contact">
      <div><label>PHONE</label><span class="val">${m.phone}</span><button data-copy="${m.phone}">번호 복사</button></div>
      <div><label>EMAIL</label><span class="val">${m.email}</span><button data-copy="${m.email}">메일 복사</button></div>
      ${m.addr?`<div><label>OFFICE</label><span class="val" style="font-size:14px;font-weight:400">${esc(m.addr)}</span></div>`:""}
    </div>
    ${m.links.length?`<div class="links">${m.links.map(([t,u])=>`<a class="btn" href="${u}" target="_blank" rel="noopener">${t} →</a>`).join("")}</div>`:""}
  </div></section>`;
}

function drawPicked(){
  const box=document.getElementById("picked"); if(!box) return;
  document.querySelectorAll("[data-need]").forEach(b=>b.setAttribute("aria-pressed",picked.has(b.dataset.need)));
  const ks=ORDER.filter(k=>picked.has(k));
  box.innerHTML = ks.length?`<p class="cnt">선택한 포지션 <b>${ks.length}</b> · 이 전문가만 함께합니다</p><div class="pk">${ks.map(k=>`<a href="#${k}">${face(k)}<div><b>${M[k].name}</b><span>${esc(M[k].co)}</span><small>${esc(M[k].stageTxt)}</small></div></a>`).join("")}</div>`
    :`<p class="cnt">위에서 필요한 포지션을 눌러 주세요.</p>`;
}
function render(){
  const k=(location.hash||"#home").slice(1);
  const key=M[k]?k:"home";
  document.getElementById("app").innerHTML = key==="home"?home():member(key);
  nav(key);
  drawPicked();
  document.title = key==="home"?"YDP 마케팅 파워팀":`${M[key].name} · YDP 마케팅 파워팀`;
  const cur=document.querySelector('.nav [aria-current]'); if(cur) cur.scrollIntoView({block:"nearest",inline:"center"});
}
document.addEventListener("click",e=>{
  const nd=e.target.closest("[data-need]");
  if(nd){const k=nd.dataset.need;picked.has(k)?picked.delete(k):picked.add(k);drawPicked();return}
  const cb=e.target.closest("[data-combo]");
  if(cb){picked=new Set(cb.dataset.combo.split(","));drawPicked();return}
  const t=e.target.closest("[data-tab]");
  if(t){const n=t.dataset.tab;document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",b===t));document.querySelectorAll("[data-panel]").forEach(p=>p.hidden=p.dataset.panel!==n);return}
  const b=e.target.closest("[data-copy]"); if(!b) return;
  const v=b.dataset.copy, old=b.textContent;
  const done=()=>{b.textContent="복사됨";setTimeout(()=>b.textContent=old,1500)};
  if(navigator.clipboard) navigator.clipboard.writeText(v).then(done).catch(()=>{const s=getSelection(),r=document.createRange();r.selectNodeContents(b.previousElementSibling);s.removeAllRanges();s.addRange(r)});
});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
render();
</script>
